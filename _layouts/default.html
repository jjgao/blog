<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="color-scheme" content="light dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    {% if page.layout == 'post' %}<div class="reading-progress" id="reading-progress" aria-hidden="true"></div>{% endif %}
    <div class="page-shell">
      <header class="site-header">
        <div class="wrap site-header-inner">
          <div>
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <p class="site-tagline">{{ site.description }}</p>
          </div>
          <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
            <a href="{{ '/archive/' | relative_url }}">Archive</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          </nav>
          </nav>
        </div>
      </header>
      <main class="wrap page-content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <div class="wrap footer-inner">
          <p>Built with GitHub Pages.</p>
          <p><a href="{{ '/archive/' | relative_url }}">Browse all posts</a></p>
        </div>
      </footer>
    </div>
    {% if page.layout == 'post' %}
    <script>
      (function () {
        var bar = document.getElementById('reading-progress');
        function update() {
          var h = document.documentElement;
          var max = h.scrollHeight - h.clientHeight;
          bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(h.scrollTop / max, 1) : 0) + ')';
        }
        document.addEventListener('scroll', update, { passive: true });
        update();
      })();
    </script>
    {% endif %}
  </body>
</html>
