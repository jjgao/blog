<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="wrap site-header-inner">
          <div>
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <p class="site-tagline">{{ site.description }}</p>
          </div>
          <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/archive/' | relative_url }}">Archive</a>
            <a href="{{ '/about/' | relative_url }}">About</a>
          </nav>
        </div>
      </header>
      <main class="wrap page-content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <div class="wrap footer-inner">
          <p>Built with GitHub Pages.</p>
          <p><a href="{{ '/archive/' | relative_url }}">Browse all posts</a></p>
        </div>
      </footer>
    </div>
  </body>
</html>
